# netlify.toml - Netlify Deployment and Configuration File
# This enables single-page-application routing and proxies for our client-side app.

[build]
  publish = "dist"
  command = "npm run build"

# SPA redirection rules: redirect all requests to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-control headers for optimal static performance matching Netlify conventions
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
